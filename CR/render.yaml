services:
  - type: web
    name: car-rental
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: car-rental-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: car-rental-db
          property: password

databases:
  - name: car-rental-db
    plan: free
    databaseName: car_rental
    user: postgres
