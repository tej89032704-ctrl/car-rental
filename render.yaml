# Render blueprint for CAR-ENT.
#
# One Docker web service hosts the API and all five portals on a single origin,
# because the free tier is one service per instance:
#
#   /            -> redirect to /renter
#   /renter      -> customer portal
#   /owner       -> owner portal (OwnerHub)
#   /admin       -> admin portal
#   /agent       -> agent portal
#   /manager     -> CRM / manager portal
#   /api/...     -> the Nest API
#   /uploads/... -> owner photos and KYC documents
#
# JWT_SECRET is generated on first apply; set ADMIN_PASSWORD (and optionally
# ADMIN_EMAIL) here if you want something other than the demo super admin
# (admin@platform.local / Admin@12345), which the API creates on first boot.
services:
  - type: web
    name: car-rental
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/tej89032704-ctrl/car-rental
    branch: main
    # The liveness endpoint. It answers from the Node process itself and
    # reports the database in its body without failing on it, so a deploy that
    # comes up while Postgres is still starting is not rolled back — and a
    # service that answered nothing at all is caught.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Managed in the dashboard (Environment → DATABASE_URL), not pulled from
      # the Render database below: that free instance expired on 17 Nov 2026
      # and the app now runs on a free Neon Postgres in Oregon. `sync: false`
      # keeps a blueprint sync from overwriting the dashboard value.
      - key: DATABASE_URL
        sync: false
      # Render's internal database hostname has no dot, so the API connects
      # without TLS; a public host (Supabase, Neon, Render's external URL) is
      # detected from the hostname and uses TLS. Override with DB_SSL=require or
      # DB_SSL=disable only if a provider disagrees.
      # Optional overrides for the auto-seeded super admin. Remove to use the
      # demo credentials, which are printed to the deploy log on first boot.
      # - key: ADMIN_EMAIL
      #   value: admin@platform.local
      # - key: ADMIN_PASSWORD
      #   generateValue: true

databases:
  - name: car-rental-db
    plan: free
    region: oregon
    databaseName: cr_prod
