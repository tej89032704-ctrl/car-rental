<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAR-ENT · Your dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1014;
    --panel: #17181d;
    --panel-2: #1e2027;
    --line: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --muted: rgba(245,245,247,0.55);
    --amber: #f5f5f7;
    --amber-2: #b3b3ba;
    --red: #ff5d5d;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Ambient amber glow, echoing the login box aura */
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 40vmax at 15% 10%, rgba(255,255,255,0.10), transparent 60%),
      radial-gradient(50vmax 36vmax at 85% 90%, rgba(255,255,255,0.12), transparent 60%),
      radial-gradient(30vmax 24vmax at 80% 15%, rgba(255,255,255,0.06), transparent 60%);
  }
  .card {
    position: relative;
    width: min(400px, calc(100vw - 3rem));
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 2.6rem 2.2rem 2.4rem;
    text-align: center;
    box-shadow: 0 30px 80px rgba(10,12,18,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: -6rem; left: 50%; transform: translateX(-50%);
    width: 22rem; height: 12rem;
    background: radial-gradient(closest-side, rgba(255,255,255,0.14), transparent 70%);
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.6rem; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #f5f5f7, #b3b3ba);
    box-shadow: 0 0 12px rgba(255,255,255,0.5);
    animation: pulseDot 2.6s ease-in-out infinite;
  }
  .brand .name {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(245,245,247,0.85);
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.5); } }
  .tyre-wrap { width: 96px; height: 96px; margin: 0 auto 1.4rem; }
  .tyre { width: 100%; height: 100%; animation: tyreSpin 1.2s linear infinite; }
  @keyframes tyreSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.35rem; }
  .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.7rem; }
  .dots span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #f5f5f7; margin: 0 4px;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    width: 100%; margin-top: 1.8rem;
    padding: 0.82rem; border-radius: 13px; border: none;
    background: #17181d; color: #f5f5f7; box-shadow: 0 0 0 1px rgba(255,255,255,0.16);
    font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    text-decoration: none; transition: filter 0.25s, box-shadow 0.3s, transform 0.15s;
  }
  .btn:hover { background: #1e2027; box-shadow: 0 0 0 1px rgba(255,255,255,0.3), 0 6px 18px rgba(0,0,0,0.5); }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 15px; height: 15px; transition: transform 0.25s; }
  .btn:hover svg { transform: translateX(4px); }
  .foot { margin-top: 1.3rem; font-size: 0.78rem; color: rgba(245,245,247,0.45); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="brand"><span class="dot"></span><span class="name">CAR-ENT</span></div>
    <div class="tyre-wrap">
      <svg class="tyre" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="54" stroke="#f5f5f7" stroke-width="6" opacity="0.9"/>
        <circle cx="60" cy="60" r="42" stroke="#555" stroke-width="2"/>
        <circle cx="60" cy="60" r="20" stroke="#f5f5f7" stroke-width="4"/>
        <circle cx="60" cy="60" r="8" fill="#f5f5f7"/>
        <line x1="60" y1="16" x2="60" y2="40" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <line x1="60" y1="80" x2="60" y2="104" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <line x1="16" y1="60" x2="40" y2="60" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <line x1="80" y1="60" x2="104" y2="60" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <line x1="28.9" y1="28.9" x2="45.9" y2="45.9" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="74.1" y1="74.1" x2="91.1" y2="91.1" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="91.1" y1="28.9" x2="74.1" y2="45.9" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="45.9" y1="74.1" x2="28.9" y2="91.1" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="welcome">Buckle up.</h1>
    <p class="sub" id="status">Taking you to your dashboard…</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <a class="btn" id="continue" href="#">Continue <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></a>
    <div class="foot">The page will redirect automatically.</div>
  </div>
  <script>
    (function () {
      var user = null, token = null;
      try { user = JSON.parse(localStorage.getItem('user')); } catch (_) {}
      try { token = localStorage.getItem('token'); } catch (_) {}
      if (!token || !user) { window.location.replace('/'); return; }

      var target = 'customer-dashboard.html';
      if (user.role === 'owner') target = 'owner-dashboard.html';
      else if (user.role === 'admin') target = 'admin-dashboard.html';

      var welcome = document.getElementById('welcome');
      var status = document.getElementById('status');
      var cont = document.getElementById('continue');
      if (welcome) welcome.textContent = 'Welcome, ' + (user.name || 'there') + '.';
      if (status) status.textContent = 'Taking you to your ' + (user.role === 'owner' ? 'owner' : 'customer') + ' dashboard…';
      cont.href = target;

      setTimeout(function () { window.location.replace(target); }, 1400);
    })();
  </script>
</body>
</html>
