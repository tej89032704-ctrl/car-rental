<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAR-ENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Hallmark · macrostructure: Manifesto · tone: utilitarian · anchor hue: warm-orange
       * theme: Cobalt (dark paper · geometric-sans · warm accent)
       * fonts: Space Grotesk (display) + Geist (body)
       * enrichment: role-based gradient backgrounds
       */

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overflow-x: clip; }

      body {
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: 1.6;
        color: var(--color-ink);
        background: var(--color-paper);
        width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: clip;
      }

      /* ===== ROLE BACKDROP ===== */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .backdrop__layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.8s var(--ease-out);
      }
      .backdrop__layer--pick {
        background:
          radial-gradient(ellipse 80% 60% at 20% 30%, var(--bg-pick-from), transparent 70%),
          radial-gradient(ellipse 60% 80% at 80% 70%, var(--bg-pick-to), transparent 70%),
          linear-gradient(160deg, var(--bg-pick-from) 0%, var(--bg-pick-mid) 40%, var(--bg-pick-to) 100%);
      }
      .backdrop__layer--give {
        background:
          radial-gradient(ellipse 80% 60% at 80% 25%, var(--bg-give-from), transparent 70%),
          radial-gradient(ellipse 60% 80% at 20% 75%, var(--bg-give-to), transparent 70%),
          linear-gradient(200deg, var(--bg-give-from) 0%, var(--bg-give-mid) 40%, var(--bg-give-to) 100%);
      }
      .backdrop.is-pick .backdrop__layer--pick { opacity: 1; }
      .backdrop.is-give .backdrop__layer--give { opacity: 1; }

      /* ===== PAGE LAYOUT ===== */
      .page {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 1fr;
        padding: var(--space-lg);
      }
      @media (min-width: 60rem) {
        .page {
          grid-template-columns: 1fr 1fr;
          align-items: center;
          padding: var(--space-2xl) var(--space-3xl);
          gap: var(--space-3xl);
        }
      }

      /* ===== BRAND (left column) ===== */
      .brand {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        padding-bottom: var(--space-xl);
      }
      @media (min-width: 60rem) {
        .brand {
          padding-bottom: 0;
          align-self: center;
        }
      }
      .brand__mark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(2.5rem, 6vw + 1rem, 5rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--color-ink);
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .brand__mark .accent {
        color: var(--color-accent);
        transition: color 0.6s var(--ease-out);
      }
      .brand__tagline {
        font-family: var(--font-body);
        font-size: var(--text-md);
        font-weight: 400;
        line-height: 1.5;
        color: var(--color-muted);
        max-width: 28ch;
        transition: color 0.6s var(--ease-out);
      }
      @media (min-width: 60rem) {
        .brand__tagline {
          font-size: var(--text-lg);
          max-width: 22ch;
        }
      }

      /* ===== LOGIN CARD (right column) ===== */
      .login-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        background: var(--color-card);
        border: var(--rule-width) solid var(--color-rule);
        border-radius: var(--radius-lg);
        padding: var(--space-xl) var(--space-lg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* ===== ROLE TABS ===== */
      .role-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2xs);
        background: var(--color-paper-3);
        border: var(--rule-width) solid var(--color-rule-2);
        border-radius: var(--radius-md);
        padding: var(--space-2xs);
        margin-bottom: var(--space-lg);
      }
      .role-tab {
        border: none;
        background: transparent;
        color: var(--color-muted);
        font-family: var(--font-body);
        font-size: var(--text-sm);
        font-weight: 500;
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-xs);
        transition: background var(--dur-normal) var(--ease-out),
                    color var(--dur-normal) var(--ease-out);
      }
      .role-tab svg {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .role-tab[aria-selected="true"] {
        background: var(--color-accent);
        color: var(--color-paper);
      }
      .role-tab:hover:not([aria-selected="true"]) {
        background: var(--color-paper-3);
        color: var(--color-ink-2);
      }
      .role-tab:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      .role-copy {
        font-size: var(--text-sm);
        color: var(--color-muted);
        margin-top: calc(-1 * var(--space-sm));
        margin-bottom: var(--space-lg);
        min-height: 1.5em;
      }

      /* ===== FIELDS ===== */
      .field {
        margin-bottom: var(--space-md);
      }
      .field label {
        display: block;
        font-size: var(--text-xs);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: var(--space-2xs);
      }
      .field input {
        width: 100%;
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
        border: var(--rule-width) solid var(--color-rule-2);
        outline: 2px solid transparent;
        outline-offset: 1px;
        background: var(--color-paper-3);
        color: var(--color-ink);
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: 1.5;
        transition: border-color var(--dur-normal) var(--ease-out);
      }
      .field input::placeholder {
        color: var(--color-neutral);
      }
      .field input:hover {
        border-color: var(--color-neutral);
      }
      .field input:focus-visible {
        border-color: var(--color-accent);
        outline-color: var(--color-focus);
      }
      .field input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .field input[aria-invalid="true"] {
        border-color: var(--color-error);
        outline-color: var(--color-error);
      }

      /* ===== CTA ===== */
      .cta {
        width: 100%;
        margin-top: var(--space-sm);
        padding: var(--space-xs) var(--space-md);
        border: none;
        border-radius: var(--radius-sm);
        background: var(--color-accent);
        color: var(--color-paper);
        font-family: var(--font-body);
        font-size: var(--text-base);
        font-weight: 600;
        cursor: pointer;
        transition: background var(--dur-normal) var(--ease-out),
                    transform var(--dur-fast) var(--ease-out);
      }
      .cta:hover {
        background: var(--color-accent-2);
        transform: translateY(-1px);
      }
      .cta:active {
        transform: translateY(0);
      }
      .cta:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      .cta:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* ===== DIVIDER ===== */
      .divider {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin: var(--space-lg) 0;
        color: var(--color-neutral);
        font-size: var(--text-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: var(--rule-width);
        background: var(--color-rule-2);
      }

      /* ===== GOOGLE BTN ===== */
      .google-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-xs);
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-sm);
        border: var(--rule-width) solid var(--color-rule-2);
        background: var(--color-paper-2);
        color: var(--color-ink);
        font-family: var(--font-body);
        font-weight: 500;
        font-size: var(--text-base);
        cursor: pointer;
        transition: background var(--dur-normal) var(--ease-out),
                    border-color var(--dur-normal) var(--ease-out);
      }
      .google-btn:hover {
        background: var(--color-paper-3);
        border-color: var(--color-neutral);
      }
      .google-btn:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      .google-btn svg {
        width: 18px;
        height: 18px;
        flex: none;
      }

      /* ===== FOOTER TOGGLE ===== */
      .login-foot {
        text-align: center;
        margin-top: var(--space-lg);
        font-size: var(--text-sm);
        color: var(--color-muted);
      }
      .login-foot a {
        color: var(--color-ink);
        text-decoration: none;
        border-bottom: var(--rule-width) solid var(--color-neutral);
        transition: border-color var(--dur-normal) var(--ease-out);
      }
      .login-foot a:hover {
        border-color: var(--color-ink);
      }
      .login-foot a:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      /* ===== ERROR ===== */
      .error-msg {
        color: var(--color-error);
        font-size: var(--text-sm);
        text-align: center;
        margin-top: var(--space-sm);
        min-height: 1.5em;
      }

      /* ===== MOBILE TWEAKS ===== */
      @media (max-width: 59.999rem) {
        .page {
          padding: var(--space-lg) var(--space-md);
        }
        .brand {
          text-align: left;
          padding-top: var(--space-2xl);
        }
        .login-card {
          max-width: 100%;
        }
      }

      /* ===== REDUCED MOTION ===== */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
        .backdrop__layer {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop is-pick">
      <div class="backdrop__layer backdrop__layer--pick"></div>
      <div class="backdrop__layer backdrop__layer--give"></div>
    </div>

    <div class="page">
      <div class="brand">
        <div class="brand__mark">CAR<span class="accent">-</span>ENT</div>
        <p class="brand__tagline">Rent. Drive. Return. A car rental platform built for people who move.</p>
      </div>

      <div class="login-wrap">
        <div class="login-card">
          <div class="role-tabs" role="tablist" aria-label="Choose account type">
            <button class="role-tab" id="tabPick" role="tab" aria-selected="true" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/>
                <rect x="3" y="13" width="18" height="6" rx="1.5"/>
                <circle cx="7.5" cy="19" r="1.3"/>
                <circle cx="16.5" cy="19" r="1.3"/>
              </svg>
              Pick a car
            </button>
            <button class="role-tab" id="tabGive" role="tab" aria-selected="false" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/>
                <rect x="4" y="15" width="16" height="6" rx="1.5"/>
              </svg>
              Give a car
            </button>
          </div>
          <div class="role-copy" id="roleCopy">Find and rent a car near you in minutes</div>

          <div class="field" id="nameField" style="display:none">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your full name" autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
          </div>

          <button class="cta" id="signinBtn" type="button">Sign in to pick a car</button>

          <div class="divider">or</div>

          <button class="google-btn" id="googleBtn" type="button">
            <svg viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4c-7.4 0-13.8 4.2-17 10.3z"/>
              <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14.1-5l-6.5-5.3C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.9 39.6 16.4 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.5 5.3C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
            </svg>
            Continue with Google
          </button>

          <div class="login-foot" id="authToggle">
            New here? <a href="#" id="toggleLink">Create an account</a>
          </div>
          <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script>
      const API = window.location.port === "5173" ? "http://localhost:8081/api/auth" : "/api/auth";
      let isRegister = false;
      const tabPick   = document.getElementById("tabPick");
      const tabGive   = document.getElementById("tabGive");
      const roleCopy  = document.getElementById("roleCopy");
      const signinBtn = document.getElementById("signinBtn");
      const nameInput = document.getElementById("name");
      const nameField = document.getElementById("nameField");
      const email     = document.getElementById("email");
      const password  = document.getElementById("password");
      const errorMsg  = document.getElementById("errorMsg");
      const toggleLink= document.getElementById("toggleLink");
      const backdrop  = document.querySelector(".backdrop");

      const copyByRole = {
        pick: "Find and rent a car near you in minutes",
        give: "List your car and start earning when you're not using it",
      };

      let currentRole = "pick";
      function setRole(role) {
        currentRole = role;
        const isPick = role === "pick";
        tabPick.classList.toggle("active", isPick);
        tabGive.classList.toggle("active", !isPick);
        tabPick.setAttribute("aria-selected", String(isPick));
        tabGive.setAttribute("aria-selected", String(!isPick));
        roleCopy.textContent = copyByRole[role];
        signinBtn.textContent = isPick
          ? (isRegister ? "Register to pick a car" : "Sign in to pick a car")
          : (isRegister ? "Register to give a car"  : "Sign in to give a car");
        backdrop.classList.toggle("is-pick", isPick);
        backdrop.classList.toggle("is-give", !isPick);
      }
      tabPick.addEventListener("click", () => setRole("pick"));
      tabGive.addEventListener("click", () => setRole("give"));

      toggleLink.addEventListener("click", (e) => {
        e.preventDefault();
        isRegister = !isRegister;
        nameField.style.display = isRegister ? "block" : "none";
        signinBtn.textContent   = isRegister
          ? (currentRole === "pick" ? "Register to pick a car" : "Register to give a car")
          : (currentRole === "pick" ? "Sign in to pick a car"  : "Sign in to give a car");
        toggleLink.textContent  = isRegister ? "Sign in" : "Create an account";
        errorMsg.textContent    = "";
      });

      function showError(msg) { errorMsg.textContent = msg; }

      signinBtn.addEventListener("click", async () => {
        errorMsg.textContent = "";
        const nameVal  = nameInput.value.trim();
        const emailVal = email.value.trim();
        const passVal  = password.value.trim();
        if (!emailVal || !passVal || (isRegister && !nameVal)) { showError("Please fill in all fields"); return; }
        if (!emailVal.includes("@")) { showError("Please enter a valid email"); return; }
        if (passVal.length < 6) { showError("Password must be at least 6 characters"); return; }
        signinBtn.disabled = true;
        signinBtn.textContent = isRegister ? "Registering\u2026" : "Signing in\u2026";
        try {
          const endpoint = isRegister ? `${API}/register` : `${API}/login`;
          const role = currentRole === "pick" ? "customer" : "owner";
          const body = isRegister
            ? { name: nameVal, email: emailVal, password: passVal, role }
            : { email: emailVal, password: passVal, role };
          const res  = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          const data = await res.json();
          if (!res.ok) { showError(data.message || "Something went wrong"); signinBtn.disabled = false; signinBtn.textContent = isRegister ? "Register" : "Sign in"; return; }
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data));
          window.location.href = "dashboard.html";
        } catch (err) {
          showError("Cannot connect to server. Make sure the backend is running on port 8081.");
          signinBtn.disabled = false;
          signinBtn.textContent = isRegister ? "Register" : "Sign in";
        }
      });

      document.getElementById("googleBtn").addEventListener("click", () => {
        showError("Google sign-in coming soon");
      });
    </script>
  </body>
</html>
