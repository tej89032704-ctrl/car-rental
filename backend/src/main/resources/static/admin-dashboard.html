<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAR-ENT · Admin</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    background:
      radial-gradient(60vmax 34vmax at 50% -8%, rgba(255,255,255,0.05), transparent 70%),
      linear-gradient(180deg, #17181d 0%, #0f1014 100%) fixed;
    color: #f5f5f7;
  }
  .box { text-align: center; padding: 2rem; }
  .box .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, #f5f5f7, #b3b3ba);
    box-shadow: 0 0 12px rgba(255,255,255,0.5);
  }
  .box h1 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin: 0.6rem 0 0.4rem; }
  .box p { font-size: 0.85rem; color: rgba(245,245,247,0.55); margin: 0 0 1.2rem; }
  .box a {
    display: inline-block; padding: 0.7rem 1.3rem; border-radius: 12px; margin: 0.25rem;
    text-decoration: none; font-weight: 700; font-size: 0.85rem;
    background: linear-gradient(135deg, #f5f5f7, #b3b3ba); color: #17181d;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1>CAR-ENT</h1>
    <p>Redirecting to your console…</p>
    <a href="super-admin-dashboard.html">Super admin console</a>
    <a href="agent-dashboard.html">Agent desk</a>
  </div>
  <script>
    (function () {
      var user = null;
      try { user = JSON.parse(localStorage.getItem('admin_user')); } catch (e) {}
      if (user && user.role === 'agent') { window.location.replace('agent-dashboard.html'); }
      else { window.location.replace('super-admin-dashboard.html'); }
    })();
  </script>
</body>
</html>
