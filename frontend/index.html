<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAR-ENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --horizon: #cc5b2e;
        --horizon-glow: #f0934d;
        --lane: #e8b400;
        --cream: #f5f1e6;
        --muted: #b9afa0;
        --focus: #f0934d;
      }
      .icon-primary { fill: var(--icon-primary, #1E293B); }
      .icon-secondary { fill: var(--icon-secondary, #7DD3FC); }
      .icon-primary-stroke { stroke: var(--icon-primary, #1E293B); }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ================= VIDEO BACKGROUND ================= */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .backdrop video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          900px 700px at 50% 45%,
          transparent 0%,
          rgba(8, 9, 16, 0.55) 100%
        );
        z-index: 1;
        pointer-events: none;
      }

      /* ================= LOGIN PAGE ================= */
      #login {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }
      .login-card {
        width: min(400px, 90vw);
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 32px 30px 28px;
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
      }
      .login-mark {
        text-align: center;
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 28px;
        color: var(--cream);
        margin-bottom: 4px;
      }
      .login-mark span {
        color: var(--lane);
      }
      .login-sub {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 22px;
      }

      .role-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 5px;
        margin-bottom: 22px;
      }
      .role-tab {
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 8px;
        border-radius: 9px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .role-tab svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .role-tab.active {
        background: var(--horizon);
        color: #1a0f08;
      }
      .role-tab:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .role-copy {
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
        margin: -10px 0 18px;
        min-height: 16px;
      }

      .field {
        margin-bottom: 15px;
      }
      .field label {
        display: block;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 11px 13px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.28);
        color: var(--cream);
        font-family: "Inter", sans-serif;
        font-size: 14px;
      }
      .field input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .signin-btn {
        width: 100%;
        margin-top: 4px;
        padding: 12px;
        border: none;
        border-radius: 9px;
        background: var(--horizon);
        color: #1a0f08;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .signin-btn:hover {
        background: var(--horizon-glow);
      }
      .signin-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
      }

      .google-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 11px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: #fff;
        color: #1f1f1f;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .google-btn:hover {
        background: #f3f3f3;
      }
      .google-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .google-btn svg {
        width: 18px;
        height: 18px;
      }

      .login-foot {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .login-foot a {
        color: var(--cream);
        text-decoration: none;
        border-bottom: 1px solid var(--muted);
      }

    </style>
  </head>
  <body>
    <div class="backdrop">
      <video autoplay muted loop playsinline poster="videos/man-window-highway-poster.jpg">
        <source src="videos/man-window-highway.mp4" type="video/mp4" />
      </video>
      <div class="vignette"></div>
    </div>

    <div id="login">
      <div class="login-card">
        <div class="login-mark">CAR<span>-</span>ENT</div>
        <div class="login-sub" id="formTitle">Sign in to continue</div>

        <div class="role-tabs" role="tablist" aria-label="Choose account type">
          <button
            class="role-tab active"
            id="tabPick"
            role="tab"
            aria-selected="true"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"
              />
              <rect x="3" y="13" width="18" height="6" rx="1.5" />
              <circle cx="7.5" cy="19" r="1.3" />
              <circle cx="16.5" cy="19" r="1.3" />
            </svg>
            Pick a car
          </button>
          <button
            class="role-tab"
            id="tabGive"
            role="tab"
            aria-selected="false"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 3v12" />
              <path d="M7 8l5-5 5 5" />
              <rect x="4" y="15" width="16" height="6" rx="1.5" />
            </svg>
            Give a car
          </button>
        </div>

        <div class="role-copy" id="roleCopy">
          Find and rent a car near you in minutes
        </div>

        <div class="field" id="nameField" style="display: none">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your full name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
        <button class="signin-btn" id="signinBtn" type="button">
          Sign in to pick a car
        </button>

        <div class="divider">or</div>

        <button class="google-btn" id="googleBtn" type="button">
          <svg viewBox="0 0 48 48">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4c-7.4 0-13.8 4.2-17 10.3z"
            />
            <path
              fill="#4CAF50"
              d="M24 44c5.4 0 10.3-1.8 14.1-5l-6.5-5.3C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.9 39.6 16.4 44 24 44z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.5 5.3C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"
            />
          </svg>
          Continue with Google
        </button>

        <div class="login-foot" id="authToggle">
          New here? <a href="#" id="toggleLink">Create an account</a>
        </div>
        <div
          id="errorMsg"
          style="
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
          "
        ></div>
      </div>
    </div>

    <script>
      const API = "http://localhost:8081/api/auth";
      let isRegister = false;

      const tabPick = document.getElementById("tabPick");
      const tabGive = document.getElementById("tabGive");
      const roleCopy = document.getElementById("roleCopy");
      const signinBtn = document.getElementById("signinBtn");
      const nameInput = document.getElementById("name");
      const nameField = document.getElementById("nameField");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const errorMsg = document.getElementById("errorMsg");
      const formTitle = document.getElementById("formTitle");
      const toggleLink = document.getElementById("toggleLink");

      const copyByRole = {
        pick: "Find and rent a car near you in minutes",
        give: "List your car and start earning when you're not using it",
      };

      let currentRole = "pick";
      function setRole(role) {
        currentRole = role;
        const isPick = role === "pick";
        tabPick.classList.toggle("active", isPick);
        tabGive.classList.toggle("active", !isPick);
        tabPick.setAttribute("aria-selected", String(isPick));
        tabGive.setAttribute("aria-selected", String(!isPick));
        roleCopy.textContent = copyByRole[role];
        signinBtn.textContent = isPick
          ? isRegister
            ? "Register to pick a car"
            : "Sign in to pick a car"
          : isRegister
            ? "Register to give a car"
            : "Sign in to give a car";
      }
      tabPick.addEventListener("click", () => setRole("pick"));
      tabGive.addEventListener("click", () => setRole("give"));

      toggleLink.addEventListener("click", (e) => {
        e.preventDefault();
        isRegister = !isRegister;
        nameField.style.display = isRegister ? "block" : "none";
        formTitle.textContent = isRegister
          ? "Create your account"
          : "Sign in to continue";
        signinBtn.textContent = isRegister
          ? currentRole === "pick"
            ? "Register to pick a car"
            : "Register to give a car"
          : currentRole === "pick"
            ? "Sign in to pick a car"
            : "Sign in to give a car";
        toggleLink.textContent = isRegister ? "Sign in" : "Create an account";
        errorMsg.style.display = "none";
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = "block";
      }

      signinBtn.addEventListener("click", async () => {
        errorMsg.style.display = "none";
        const nameVal = nameInput.value.trim();
        const emailVal = email.value.trim();
        const passVal = password.value.trim();

        if (!emailVal || !passVal || (isRegister && !nameVal)) {
          showError("Please fill in all fields");
          return;
        }
        if (!emailVal.includes("@")) {
          showError("Please enter a valid email");
          return;
        }
        if (passVal.length < 6) {
          showError("Password must be at least 6 characters");
          return;
        }

        signinBtn.disabled = true;
        signinBtn.textContent = "Loading...";

        try {
          const endpoint = isRegister ? `${API}/register` : `${API}/login`;
          const role = currentRole === "pick" ? "customer" : "owner";
          const body = isRegister
            ? { name: nameVal, email: emailVal, password: passVal, role }
            : { email: emailVal, password: passVal };

          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const data = await res.json();

          if (!res.ok) {
            showError(data.message || "Something went wrong");
            signinBtn.disabled = false;
            signinBtn.textContent = isRegister ? "Register" : "Sign in";
            return;
          }

          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data));

          window.location.href = "/dashboard.html";
        } catch (err) {
          showError(
            "Cannot connect to server. Make sure the backend is running on port 8081.",
          );
          signinBtn.disabled = false;
          signinBtn.textContent = isRegister ? "Register" : "Sign in";
        }
      });

      document.getElementById("googleBtn").addEventListener("click", () => {
        showError("Google sign-in coming soon");
      });
    </script>
  </body>
</html>
