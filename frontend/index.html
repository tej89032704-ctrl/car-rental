<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAR-ENT — Unlock the road.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/cursor/cursor.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Geist', system-ui, sans-serif;
      overflow: hidden;
      min-height: 100vh;
      background: #0a0a0a;
      color: #fff;
    }

    /* ===== FULL BACKGROUND ===== */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: #0a0a0a url('/images/customer.png') center/cover no-repeat;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.6) 100%);
    }
    .bg-owner {
      position: fixed; inset: 0; z-index: 0;
      background: #0a0a0a url('/images/owner.png') center/cover no-repeat;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .bg-owner::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.65) 100%);
    }
    .bg-owner.is-visible { opacity: 1; }

    /* ===== GRAIN ===== */
    .grain {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }
    .grain::after {
      content: ''; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.04;
      mix-blend-mode: overlay;
    }

    /* ===== PAGE ===== */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      padding: 2rem;
    }

    /* ===== TOP BAR ===== */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 2rem;
    }
    .logo {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .logo-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: grid; place-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .logo-text span { color: #f97316; }

    .pricing-badge {
      display: flex; gap: 0.4rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
    }
    .pricing-badge strong { color: #fff; font-weight: 600; }

    /* ===== MIDDLE ===== */
    .middle {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== CARD ===== */
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 16px 64px rgba(0,0,0,0.4);
    }

    .card-role {
      display: flex; gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .card-role-btn {
      flex: 1;
      padding: 0.7rem 0.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-family: 'Geist', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: all 0.25s ease;
    }
    .card-role-btn svg { width: 15px; height: 15px; }
    .card-role-btn.is-active {
      background: rgba(249,115,22,0.12);
      border-color: rgba(249,115,22,0.3);
      color: #f97316;
    }

    .card-heading {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .card-heading h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }
    .card-heading p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
    }

    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.3rem;
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-family: 'Geist', sans-serif;
      font-size: 0.88rem;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.2); }
    .field input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.08);
      background: rgba(255,255,255,0.06);
    }

    .cta {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-family: 'Geist', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(249,115,22,0.35);
    }
    .cta:active { transform: scale(0.98); }
    .cta:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .cta svg { width: 15px; height: 15px; }

    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1rem 0;
      color: rgba(255,255,255,0.2);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #fff;
      font-family: 'Geist', sans-serif;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }
    .google-btn:active { transform: scale(0.98); }
    .google-btn svg { width: 18px; height: 18px; }

    .card-foot {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.35);
    }
    .card-foot a {
      color: #f97316;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .card-foot a:hover { border-color: #f97316; }

    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 0.75rem;
      min-height: 1.3em;
    }

    /* ===== PRICING STRIP ===== */
    .pricing-strip {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
    }
    .pricing-strip span { display: flex; align-items: center; gap: 0.35rem; }
    .pricing-strip .num {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
    }
    .pricing-strip .accent { color: #f97316; }
    .pricing-strip .sep { opacity: 0.2; }

    @media (max-width: 600px) {
      .pricing-strip { font-size: 0.65rem; gap: 0.75rem; padding: 0.6rem 1rem; flex-wrap: wrap; }
      .top { padding-bottom: 1rem; }
      .card { padding: 1.5rem; border-radius: 20px; }
      .page { padding: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .suv-cursor { display: none; }
      body { cursor: auto; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-owner" id="bgOwner"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="page">
    <div class="top">
      <div class="logo">
        <div class="logo-icon">C</div>
        <div class="logo-text">CAR<span>-</span>ENT</div>
      </div>
      <div class="pricing-badge">
        <span>Renters <strong>₹0</strong></span>
        <span style="opacity:0.2">·</span>
        <span>Owners <strong>₹100</strong><span style="opacity:0.5">/mo</span></span>
      </div>
    </div>

    <div class="middle">
      <div class="card">
        <div class="card-role" id="roleSwitcher">
          <button class="card-role-btn is-active" id="btnPick">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            Rent a Car
          </button>
          <button class="card-role-btn" id="btnGive">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><rect x="4" y="15" width="16" height="6" rx="1.5"/></svg>
            Give Your Car
          </button>
        </div>

        <div class="card-heading">
          <h1 id="cardTitle">Drive anything you want</h1>
          <p id="cardSub">No subscription. Pay only for what you drive.</p>
        </div>

        <div class="field" id="nameField" style="display:none">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your full name" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
        </div>

        <button class="cta" id="signinBtn">
          <span>Get started free</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <div class="divider">or</div>

        <button class="google-btn" id="googleBtn" type="button">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6 29.5 4 24 4c-7.4 0-13.8 4.2-17 10.3z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14.1-5l-6.5-5.3C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.5 5.3C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continue with Google
        </button>

        <div class="card-foot">
          New here? <a href="#" id="toggleLink">Create an account</a>
        </div>
        <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="pricing-strip">
    <span>🚗 Renters: <span class="num">₹0</span> <span class="accent">free forever</span></span>
    <span class="sep">|</span>
    <span>💰 Owners: <span class="num">₹100</span><span style="opacity:0.5">/month</span> <span class="accent">subscription</span></span>
  </div>

  <script src="/cursor/cursor.js" defer></script>
  <script>
    const API = window.location.port === '5173' ? 'http://localhost:8081/api/auth' : '/api/auth';
    let isRegister = false;
    let currentRole = 'pick';

    const btnPick = document.getElementById('btnPick');
    const btnGive = document.getElementById('btnGive');
    const signinBtn = document.getElementById('signinBtn');
    const nameField = document.getElementById('nameField');
    const nameInput = document.getElementById('name');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const toggleLink = document.getElementById('toggleLink');
    const cardTitle = document.getElementById('cardTitle');
    const cardSub = document.getElementById('cardSub');
    const bgOwner = document.getElementById('bgOwner');

    const content = {
      pick: { title: 'Drive anything you want', sub: 'No subscription. Pay only for what you drive.' },
      give: { title: 'Turn your car into income', sub: '₹100/month. We handle bookings, payments & support.' }
    };

    function setRole(role) {
      currentRole = role;
      const isPick = role === 'pick';
      btnPick.classList.toggle('is-active', isPick);
      btnGive.classList.toggle('is-active', !isPick);
      bgOwner.classList.toggle('is-visible', !isPick);
      const c = content[role];
      cardTitle.textContent = c.title;
      cardSub.textContent = c.sub;
      updateBtnText();
    }

    function updateBtnText() {
      const isPick = currentRole === 'pick';
      if (isRegister) {
        signinBtn.querySelector('span').textContent = isPick ? 'Create free account' : 'Register as owner — ₹100/mo';
      } else {
        signinBtn.querySelector('span').textContent = isPick ? 'Get started free' : 'Sign in as owner';
      }
    }

    btnPick.addEventListener('click', () => setRole('pick'));
    btnGive.addEventListener('click', () => setRole('give'));

    toggleLink.addEventListener('click', e => {
      e.preventDefault();
      isRegister = !isRegister;
      nameField.style.display = isRegister ? 'block' : 'none';
      updateBtnText();
      toggleLink.textContent = isRegister ? 'Sign in' : 'Create an account';
      errorMsg.textContent = '';
    });

    function showError(msg) { errorMsg.textContent = msg; }

    signinBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      const nameVal = nameInput.value.trim();
      const emailVal = email.value.trim();
      const passVal = password.value.trim();
      if (!emailVal || !passVal || (isRegister && !nameVal)) { showError('Please fill in all fields'); return; }
      if (!emailVal.includes('@')) { showError('Please enter a valid email'); return; }
      if (passVal.length < 6) { showError('Password must be at least 6 characters'); return; }
      signinBtn.disabled = true;
      signinBtn.querySelector('span').textContent = isRegister ? 'Registering\u2026' : 'Signing in\u2026';
      try {
        const endpoint = isRegister ? `${API}/register` : `${API}/login`;
        const role = currentRole === 'pick' ? 'customer' : 'owner';
        const body = isRegister
          ? { name: nameVal, email: emailVal, password: passVal, role }
          : { email: emailVal, password: passVal, role };
        const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) { showError(data.message || 'Something went wrong'); signinBtn.disabled = false; updateBtnText(); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = data.role === 'owner' ? 'owner-dashboard.html' : 'dashboard.html';
      } catch (err) {
        showError('Cannot connect to server. Make sure the backend is running on port 8081.');
        signinBtn.disabled = false;
        updateBtnText();
      }
    });

    document.getElementById('googleBtn').addEventListener('click', () => {
      const role = currentRole === 'pick' ? 'customer' : 'owner';
      google.accounts.id.initialize({
        client_id: '968585560679-k9f6mnvmd9lkb1s74lbikilotnvb5tgg.apps.googleusercontent.com',
        callback: (response) => handleGoogleCredential(response, role)
      });
      google.accounts.id.prompt();
    });

    async function handleGoogleCredential(response, role) {
      errorMsg.textContent = '';
      signinBtn.disabled = true;
      signinBtn.querySelector('span').textContent = 'Signing in with Google\u2026';
      try {
        const res = await fetch(`${API}/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential, role })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.message || 'Google sign-in failed'); signinBtn.disabled = false; updateBtnText(); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = data.role === 'owner' ? 'owner-dashboard.html' : 'dashboard.html';
      } catch (err) {
        showError('Cannot connect to server. Make sure the backend is running on port 8081.');
        signinBtn.disabled = false;
        updateBtnText();
      }
    }
  </script>
</body>
</html>
